
<!DOCTYPE html>
<html lang="uz">

<div class="app">

    <header class="topbar">
        <div class="logo">✦ ZIYO <span>AI</span></div>
        <button class="new-chat" onclick="newChat()">
            + Yangi chat
        </button>
    </header>

    <main class="chat-area">

        <div class="welcome" id="welcome">
            <div class="ai-logo">✦</div>
            <h1>Salom!</h1>
            <h2>Men ZIYO AI</h2>
            <p>Sizga bugun qanday yordam bera olaman?</p>
        </div>

        <div id="messages" class="messages"></div>

    </main>

    <div class="input-area">
        <input
            type="text"
            id="userInput"
            placeholder="ZIYO AI ga xabar yozing..."
            autocomplete="off"
        >

        <button id="sendButton" onclick="sendMessage()">
            ➤
        </button>
    </div>

    <footer>
        ZIYO AI · Sizning aqlli yordamchingiz
    </footer>

</div>

<script src="script.js"></scrip

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js")

        .catch((error) => console.log("Xatolik:", error));
    });
  }
</script>
